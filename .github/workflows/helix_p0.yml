name: Helix P0 Critical Alert Monitor

on:
  schedule:
    # Runs daily at 08:00 UTC (1:00 PM PKT)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-p0-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r helix-agent/requirements.txt

      - name: Create .env File from Secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GSC_SITE_URL: "https://hellotools.net/"
        run: |
          cd helix-agent
          echo "GOOGLE_CREDENTIALS_PATH=./credentials.json" > .env
          echo "GOOGLE_TOKEN_PATH=./token.json" >> .env
          echo "GSC_SITE_URL=$GSC_SITE_URL" >> .env
          echo "SPREADSHEET_ID=$SPREADSHEET_ID" >> .env
          echo "GMAIL_ADDRESS=$GMAIL_ADDRESS" >> .env
          echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env
          echo "REPORT_EMAIL=$REPORT_EMAIL" >> .env

      - name: Restore OAuth Credentials & Token
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          cd helix-agent
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          fi
          if [ -n "$GOOGLE_TOKEN_JSON" ]; then
            echo "$GOOGLE_TOKEN_JSON" > token.json
          fi

      - name: Run Helix Daily P0 Monitor
        run: |
          cd helix-agent
          python execution/p0_monitor.py
