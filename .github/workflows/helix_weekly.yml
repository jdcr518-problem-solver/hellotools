name: Helix Weekly Brief Pipeline

on:
  schedule:
    # Runs every Monday at 06:00 UTC (11:00 AM PKT)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-weekly-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r helix-agent/requirements.txt
          playwright install chromium --with-deps

      - name: Create .env File from Secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GSC_SITE_URL: "https://hellotools.net/"
          GEMINI_MODEL: "gemini-2.5-flash"
        run: |
          cd helix-agent
          echo "GOOGLE_CREDENTIALS_PATH=./credentials.json" > .env
          echo "GOOGLE_TOKEN_PATH=./token.json" >> .env
          echo "GSC_SITE_URL=$GSC_SITE_URL" >> .env
          echo "SPREADSHEET_ID=$SPREADSHEET_ID" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "GEMINI_MODEL=$GEMINI_MODEL" >> .env
          echo "GMAIL_ADDRESS=$GMAIL_ADDRESS" >> .env
          echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env
          echo "REPORT_EMAIL=$REPORT_EMAIL" >> .env
          echo "PAGESPEED_API_KEY=$PAGESPEED_API_KEY" >> .env

      - name: Restore OAuth Credentials & Token
        run: |
          cd helix-agent
          cat << 'EOF' > credentials.json
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF
          cat << 'EOF' > token.json
          ${{ secrets.GOOGLE_TOKEN_JSON }}
          EOF

      - name: Run Helix Master Weekly Pipeline
        run: |
          cd helix-agent
          python execution/run_weekly.py
